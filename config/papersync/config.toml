# papersync configuration. See local/lib/papersync/README.md.
[render]
size = "auto"
overflow = "fail"
boxes = ["A", "B", "C", "D"]
output_dir = "."
open = true
tag = true

# [things.actions]
# today = { when = "today" }
# someday = { when = "someday" }
# waiting = { tags = ["waiting"] }

# Obsidian. The vault name is what `obsidian vaults` lists.
# papersync needs Obsidian running, and the bridge plugin installed with
# `papersync obsidian install-bridge`.
[obsidian]
vault = "Notes"
# Front matter keys that do not print in the document's property table.
frontmatter_skip = ["papersync-printed", "papersync-id"]
